version: '3.8'

services:
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - PUBLIC_BASE_URL=https://trade.yourdomain.com
      - SESSION_SECRET=production_super_secret_session_key_32_chars_min_2026!
      - INITIAL_ADMIN_PASSWORD=ProductionAdminPassword2026!
      - ALLOWED_ORIGINS=https://trade.yourdomain.com,http://localhost:8000,http://127.0.0.1:8000
    volumes:
      - platform_data:/app/.data
    restart: unless-stopped

volumes:
  platform_data:
