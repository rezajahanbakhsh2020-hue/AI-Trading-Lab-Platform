name: OpenCode P2 Signal Integration Repair

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  repair:
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'repair/ingestion-ci-audit-20261009') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/opencode') &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve and validate open same-repository PR
        id: resolve-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: number
            });
            if (pr.state !== "open" || pr.merged) {
              core.setFailed("OpenCode only runs on an open, unmerged PR.");
              return;
            }
            if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed("Refusing to write to a fork-owned branch.");
              return;
            }
            if (context.actor !== owner) {
              core.setFailed("Only the repository owner may invoke OpenCode.");
              return;
            }
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("number", String(number));

      - name: Checkout the PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-pr.outputs.head_ref }}
          persist-credentials: true

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Execute P2 integration repair
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/glm-5.3-flash-free
          agent: build
          use_github_token: true
          prompt: |
            OWNER DIRECTIVE — IMPLEMENT AND VERIFY, NOT AUDIT ONLY.

            Work exclusively in rezajahanbakhsh2020-hue/AI-Trading-Lab-Platform on the checked-out existing PR head branch. The triggering PR is #${{ steps.resolve-pr.outputs.number }} and its starting head SHA is ${{ steps.resolve-pr.outputs.head_sha }}. Do not create a duplicate PR, do not merge, and do not use Render.

            Goal: make the genuine P1 XAUUSD signal path observable through P2 and the UI, while preserving the separate P1 trading brain. Inspect this PR's complete diff, merged P2 PRs #121 and #122, and the P1 publisher/runtime source read-only. Preserve local-only data conceptually; never reset/clean or overwrite unrelated files.

            Implement the smallest safe fixes for:
            1. Authenticated P1-format publication into the local P2 HTTP ingest endpoint, using only ephemeral test credentials; never hard-code, print, commit, or persist secrets.
            2. Store the ingested record and retrieve it via the real snapshot/read API, not just a mocked helper.
            3. Enforce authoritative publication timestamp semantics: reject missing, malformed, zero, non-finite, and future publication timestamps; do not substitute event/bar timestamps or fall back past malformed primary values.
            4. Preserve exact independent timeframe identity for 1m, 5m, 15m, 30m, 1H, 4H, and 1D; no cross-timeframe fallback.
            5. Verify frontend refresh/polling displays the ingested record without manual reload where supported by the existing architecture.
            6. Add a Termux-compatible local launcher/workflow only if it can be implemented safely and commands/flags are verified against source. Do not depend on Render.
            7. Never fabricate candles or BUY/SELL signals and never weaken freshness, closed-candle, provenance, or risk checks. Genuine NO TRADE is valid.

            Run focused tests and the broadest practical relevant tests, typecheck and build. Perform an actual runner-local HTTP integration test: P1-format payload -> authenticated P2 ingest -> persisted record -> actual snapshot retrieval. Distinguish runner-local proof from owner Termux proof. Do not claim UI, Termux, or production success unless actually observed.

            Before coding, inspect branch status and diff. Make focused functional changes, add regression tests, commit and push them to this same PR branch. Do not merge. Final report must include starting and ending SHA, actual commit SHA, files changed, exact test commands/counts, whether HTTP ingest and snapshot retrieval were actually proven, seven per-timeframe results only if a real provider run succeeds, and exact remaining blockers. Continue fixing actionable failures instead of stopping at an audit or test-only commit.
