name: Production Release Verification & Platform Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout P1 repository for real cross-repository verification
        run: |
          git clone https://github.com/rezajahanbakhsh2020-hue/AI-Trading-Lab.git /tmp/AI-Trading-Lab
          cd /tmp/AI-Trading-Lab
          git checkout main
          BRANCH_NAME=$(git symbolic-ref --short HEAD 2>/dev/null || echo "detached")
          P1_SHA=$(git rev-parse HEAD)
          echo "P1 Producer Commit SHA: ${P1_SHA}"
          echo "P1 Producer Branch: ${BRANCH_NAME}"
          if [ "${BRANCH_NAME}" != "main" ]; then
            echo "ERROR: P1 checkout is on branch '${BRANCH_NAME}', expected 'main'."
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy plotly streamlit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Frontend dependencies
        run: |
          cd web
          npm ci

      - name: Frontend TypeScript Typecheck
        run: |
          cd web
          npm run typecheck

      - name: Frontend Vitest Test Suite
        run: |
          cd web
          npm test

      - name: Build Frontend SPA Production Assets
        run: |
          cd web
          npm run build

      - name: Backend & Release Validation Test Suite
        run: |
          PYTHONPATH=. pytest -v
